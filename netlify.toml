# Free test deployment on Netlify (docs/DEPLOY_FREE_TEST.md). Netlify detects Next.js and
# runs it with its own adapter. Scheduled jobs run in Supabase Cron, not on Netlify.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
